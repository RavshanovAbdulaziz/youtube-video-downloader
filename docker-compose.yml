services:
  api:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    env_file: .env
    volumes:
      - downloads:/app/backend/downloads
    ports:
      - "80:8000"
    restart: unless-stopped

  bot:
    build: .
    command: python bot.py
    env_file: .env
    volumes:
      - downloads:/app/backend/downloads
    restart: unless-stopped

volumes:
  downloads:
