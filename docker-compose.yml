services:
  # YouTube'ning bot-tekshiruvini cookie'siz, hisobga bog'liq bo'lmagan holda
  # yechish uchun "PO token" generatori (yt-dlp rasmiy wikisi tavsiya qiladi:
  # https://github.com/yt-dlp/yt-dlp/wiki/PO-Token-Guide). Cookie'lar
  # (agar berilgan bo'lsa) hisob bekor qilinishi kabi muammolarga moyil —
  # bu esa barqarorroq muqobil/qo'shimcha.
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider
    restart: unless-stopped

  api:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      - YTDLP_COOKIES_FILE=/app/backend/cookies.txt
      - YTDLP_POT_BASE_URL=http://pot-provider:4416
    volumes:
      - downloads:/app/backend/downloads
      # Ixtiyoriy (README'ga qarang): faqat yosh cheklovli/yopiq videolar
      # uchun kerak — PO token (pot-provider) asosiy himoya. Fayl yo'q bo'lsa
      # bu bind mount `docker compose up`ni butunlay ishga tushirmaydi (Docker
      # yo'q manbani bo'sh papka deb yaratadi, keyin yt-dlp uni cookie fayli
      # sifatida ocholmaydi) — shuning uchun standart holatda o'chirilgan.
      # Yoqish uchun: `cp backend/cookies.txt.example backend/cookies.txt` va
      # ichiga haqiqiy cookie'larni joylang, keyin quyidagi qatorni oching.
      # - ./backend/cookies.txt:/app/backend/cookies.txt:ro
    ports:
      - "80:8000"
    depends_on:
      - pot-provider
    restart: unless-stopped

  bot:
    build: .
    command: python bot.py
    env_file: .env
    environment:
      - YTDLP_COOKIES_FILE=/app/backend/cookies.txt
      - YTDLP_POT_BASE_URL=http://pot-provider:4416
    volumes:
      - downloads:/app/backend/downloads
      # Ixtiyoriy (README'ga qarang): faqat yosh cheklovli/yopiq videolar
      # uchun kerak — PO token (pot-provider) asosiy himoya. Fayl yo'q bo'lsa
      # bu bind mount `docker compose up`ni butunlay ishga tushirmaydi (Docker
      # yo'q manbani bo'sh papka deb yaratadi, keyin yt-dlp uni cookie fayli
      # sifatida ocholmaydi) — shuning uchun standart holatda o'chirilgan.
      # Yoqish uchun: `cp backend/cookies.txt.example backend/cookies.txt` va
      # ichiga haqiqiy cookie'larni joylang, keyin quyidagi qatorni oching.
      # - ./backend/cookies.txt:/app/backend/cookies.txt:ro
    depends_on:
      - pot-provider
    restart: unless-stopped

volumes:
  downloads:
